<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find classmates for projects, study sessions, and group work.">
  <title>MBuddy - Find a study buddy</title>
  <link rel="icon" type="image/png" href="mbuddy-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="#top" aria-label="MBuddy home"><img class="brand-logo" src="mbuddy-logo.png" alt="MBuddy - Connect, Collaborate, Succeed"></a>
    <nav aria-label="Main navigation"><a class="active" href="#matches">Find people</a><button class="text-button" id="savedNav" type="button">Saved <span class="count-pill" id="savedCount">0</span></button><button class="text-button" id="requestsNav" type="button">Requests <span class="count-pill request-count" id="requestCount">0</span></button><button class="text-button" id="authButton" type="button">Sign in</button></nav>
    <div class="header-actions"><button class="button button-secondary button-small" id="adminNav" type="button" hidden>Admin</button><button class="button button-primary button-small" id="profileButton" type="button">Create profile</button></div>
  </header>

  <main id="top">
    <section class="intro" id="matches">
      <div class="intro-row">
        <div class="intro-copy"><span class="intro-label">MBUDDY / STUDENT MATCH BOARD</span><h1>Find a<br>study buddy<span class="hero-period">.</span></h1></div>
        <div class="hero-art" aria-hidden="true"><span></span><span></span><span></span></div>
      </div>
    </section>

    <section class="match-section">
      <aside class="filter-bar" aria-label="Match filters">
        <div class="filter-heading"><div><span class="section-label">SEARCH</span><h2>Find your match</h2></div><span class="filter-mark" aria-hidden="true">⌕</span></div>
        <label class="search-box">Search<input id="searchInput" type="search" placeholder="Name, specialization, or class"></label>
        <label class="course-filter">Course &amp; Specialization<select id="courseFilter"><option value="all">All courses &amp; specializations</option><option>BSIT - Software Development</option><option>BSIT - Network and Cybersecurity</option><option>BSIT - Data Analytics</option><option>BSIT - Marketing Technology</option><option>BSIT - Entrepreneurial Technology</option><option>BSIT - AI-Powered Product Development</option><option>BSBA - Marketing Management</option><option>BSBA - Human Resource Management</option><option>BSBA - Operations Management</option><option>BSBA - AI for Business Strategy and Operations</option></select></label>
        <label>Year<select id="yearFilter"><option value="all">All years</option><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select></label>
        <label>Class time slot<select id="timeSlotFilter"><option value="all">Any time slot</option><option value="A">A - Morning</option><option value="H">H - Afternoon</option><option value="S">S - Evening</option></select></label>
        <label>Preferred work time<select id="styleFilter"><option value="all">Any work time</option><option>Morning</option><option>Afternoon</option><option>Evening</option><option>Flexible</option></select></label>
        <button class="button button-secondary button-filter" id="filterButton" type="button">Apply filters</button>
      </aside>
      <div class="results-column">
        <div class="results-meta"><div><span class="section-label">PEOPLE</span><p><strong id="resultCount">0</strong> <span id="resultLabel">matches</span></p></div><button class="text-button" id="resetButton" type="button">Clear filters</button></div>
        <div class="card-grid" id="cardGrid"></div>
        <div class="empty-state" id="emptyState"><img class="empty-logo" src="mbuddy-logo.png" alt="" aria-hidden="true"><h3 id="emptyTitle">No student profiles</h3><button class="button button-secondary" id="emptyReset" type="button" hidden>Clear filters</button></div>
      </div>
    </section>
  </main>

  <footer><a class="brand" href="#top"><img class="brand-logo footer-logo" src="mbuddy-logo.png" alt="MBuddy"></a><p>© 2026 MBuddy</p></footer>

  <dialog id="profileDialog">
    <form method="dialog" id="profileForm">
      <div class="dialog-head"><h2 id="profileDialogTitle">Create profile</h2><button class="close-button" id="closeProfileDialog" type="button" aria-label="Close">×</button></div>
      <div class="form-grid">
        <label class="full">First name<input id="profileName" required maxlength="80" placeholder="Alex"></label>
        <label>Year<select id="profileYear" required><option value="">Choose one</option><option value="1">Year 1</option><option value="2">Year 2</option><option value="3">Year 3</option><option value="4">Year 4</option></select></label>
        <label>Term<select id="profileTerm" required><option value="">Choose one</option><option value="1">Term 1</option><option value="2">Term 2</option><option value="3">Term 3</option></select></label>
        <label class="full">Course &amp; Specialization<select id="profileCourse" required><option value="">Choose one</option><option>BSIT - Software Development</option><option>BSIT - Network and Cybersecurity</option><option>BSIT - Data Analytics</option><option>BSIT - Marketing Technology</option><option>BSIT - Entrepreneurial Technology</option><option>BSIT - AI-Powered Product Development</option><option>BSBA - Marketing Management</option><option>BSBA - Human Resource Management</option><option>BSBA - Operations Management</option><option>BSBA - AI for Business Strategy and Operations</option></select></label>
        <label class="class-limit-toggle full"><input id="profileAllClasses" type="checkbox"><span>Show all classes in my specialization (advanced or petitioned)</span></label>
        <div class="full class-field"><span class="field-label">Classes this term</span><div class="class-picker"><select id="profileClassSelect" aria-label="Choose a class"><option value="">Choose a class</option></select><select id="profileClassTimeSlot" aria-label="Class time slot"><option value="">Time slot</option><option value="A">A - Morning</option><option value="H">H - Afternoon</option><option value="S">S - Evening</option></select><button class="button button-secondary" id="addClassButton" type="button">Add class</button></div></div>
        <div class="selected-classes full" id="selectedClasses" aria-live="polite"></div>
        <label class="full">What are you working on?<input id="profileGoal" required maxlength="300"></label>
        <fieldset class="full"><legend>Preferred work time</legend><div class="choice-row"><label><input type="radio" name="workstyle" value="Morning" required><span>Morning</span></label><label><input type="radio" name="workstyle" value="Afternoon"><span>Afternoon</span></label><label><input type="radio" name="workstyle" value="Evening"><span>Evening</span></label><label><input type="radio" name="workstyle" value="Flexible"><span>Flexible</span></label></div></fieldset>
      </div>
      <button class="button button-primary button-wide" id="profileSubmitButton" value="default" type="submit">Create profile</button>
    </form>
  </dialog>

  <dialog id="savedDialog">
    <div class="dialog-head"><h2>Saved profiles</h2><button class="close-button" aria-label="Close" onclick="this.closest('dialog').close()">×</button></div>
    <div id="savedList" class="saved-list"></div>
  </dialog>

  <dialog id="authDialog">
    <form id="authForm" class="auth-form">
      <div class="dialog-head"><h2>Account</h2><button class="close-button" id="closeAuthDialog" type="button" aria-label="Close">×</button></div>
      <label>MMDC email<input id="authEmail" type="email" autocomplete="email" placeholder="name@mmdc.mcl.edu.ph" required></label>
      <label>Password<input id="authPassword" type="password" autocomplete="current-password" minlength="6" maxlength="128" required></label>
      <div class="auth-actions">
        <button class="button button-primary" type="submit" value="signin">Sign in</button>
        <button class="button button-secondary" type="submit" value="signup">Create account</button>
      </div>
    </form>
  </dialog>

  <dialog id="adminDialog">
    <div class="dialog-head"><h2>Admin</h2><button class="close-button" id="closeAdminDialog" type="button" aria-label="Close">×</button></div>
    <div id="adminList" class="saved-list admin-list"></div>
  </dialog>

  <dialog id="requestsDialog">
    <div class="dialog-head"><h2>BuddyUp requests</h2><button class="close-button" id="closeRequestsDialog" type="button" aria-label="Close">×</button></div>
    <div id="requestsList" class="saved-list request-list"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="object-store.js"></script>
  <script src="courses.js"></script>
  <script src="script.js"></script>
</body>
</html>
